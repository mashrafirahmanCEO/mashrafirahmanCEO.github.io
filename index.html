<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mashrafi Rahman | AI Engineer · Cybersecurity · Entrepreneur</title>

  <meta name="description" content="Official portfolio of Mashrafi Rahman — AI Engineer, Cybersecurity Professional, and Entrepreneur. Explore AI engineering, cybersecurity, digital technology, and entrepreneurship projects.">
  <meta name="author" content="Mashrafi Rahman">
  <meta name="theme-color" content="#05070a">

  <style>
    :root {
      --bg: #05070a;
      --bg-soft: #080d12;
      --panel: rgba(10, 17, 23, 0.82);
      --panel-2: rgba(13, 22, 29, 0.9);
      --line: rgba(0, 255, 170, 0.14);
      --line-strong: rgba(0, 255, 170, 0.3);

      --green: #00f5a0;
      --green-2: #00c98b;
      --cyan: #00d9ff;
      --white: #f3f8f6;
      --muted: #91a29f;
      --muted-2: #60716e;

      --max: 1180px;
      --radius: 22px;
      --shadow:
        0 0 0 1px rgba(255,255,255,0.025),
        0 20px 60px rgba(0,0,0,0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(0,245,160,.08), transparent 28%),
        radial-gradient(circle at 85% 20%, rgba(0,217,255,.06), transparent 25%),
        var(--bg);
      color: var(--white);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: .035;
      background-image:
        linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(calc(100% - 32px), var(--max));
      margin-inline: auto;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 14px 0;
      background: rgba(5, 7, 10, .72);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .nav {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      color: var(--green);
      background: rgba(0,245,160,.045);
      box-shadow: 0 0 25px rgba(0,245,160,.08);
      font-family: monospace;
      font-size: 16px;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav-links a {
      padding: 9px 12px;
      color: var(--muted);
      font-size: 13px;
      border-radius: 9px;
      transition: .25s ease;
    }

    .nav-links a:hover {
      color: var(--green);
      background: rgba(0,245,160,.06);
    }

    .nav-cta {
      padding: 10px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      background: rgba(0,245,160,.05);
      transition: .25s ease;
    }

    .nav-cta:hover {
      background: var(--green);
      color: #00130c;
      box-shadow: 0 0 28px rgba(0,245,160,.25);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      min-height: 780px;
      display: flex;
      align-items: center;
      padding: 90px 0 80px;
    }

    .hero-grid {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .hero-grid::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(0,245,160,.09) 0,
          rgba(0,245,160,.035) 28%,
          transparent 67%);
      filter: blur(10px);
    }

    .hero-grid::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .25;
      background:
        linear-gradient(rgba(0,245,160,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,160,.045) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 70px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,245,160,.035);
      color: var(--green);
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 22px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% {
        opacity: .35;
        transform: scale(.7);
      }
    }

    .hero h1 {
      max-width: 850px;
      font-size: clamp(44px, 7vw, 82px);
      line-height: .98;
      letter-spacing: -.065em;
      margin-bottom: 24px;
    }

    .hero h1 .accent {
      color: var(--green);
      text-shadow: 0 0 35px rgba(0,245,160,.12);
    }

    .hero-description {
      max-width: 650px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 19px;
      border-radius: 11px;
      border: 1px solid var(--line-strong);
      font-size: 13px;
      font-weight: 750;
      transition: .25s ease;
    }

    .btn-primary {
      background: var(--green);
      color: #00140d;
      border-color: var(--green);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,245,160,.2);
    }

    .btn-secondary {
      background: rgba(255,255,255,.025);
      color: var(--white);
    }

    .btn-secondary:hover {
      color: var(--green);
      background: rgba(0,245,160,.05);
    }

    /* Terminal */

    .terminal {
      position: relative;
      width: 100%;
      max-width: 470px;
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(5,10,13,.88);
      box-shadow:
        0 30px 80px rgba(0,0,0,.5),
        0 0 60px rgba(0,245,160,.045);
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 43px;
      padding: 0 15px;
      border-bottom: 1px solid rgba(255,255,255,.05);
      background: rgba(255,255,255,.025);
    }

    .terminal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted-2);
    }

    .terminal-title {
      margin-left: 8px;
      color: var(--muted-2);
      font: 11px monospace;
    }

    .terminal-body {
      padding: 25px;
      font: 12px/2 monospace;
      color: #a7bab5;
    }

    .terminal-body .green {
      color: var(--green);
    }

    .terminal-body .cyan {
      color: var(--cyan);
    }

    .terminal-body .dim {
      color: #526360;
    }

    .terminal-line {
      display: block;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      margin-top: -25px;
      position: relative;
      z-index: 5;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(8,13,17,.8);
      backdrop-filter: blur(15px);
      overflow: hidden;
    }

    .stat {
      padding: 28px 24px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat strong {
      display: block;
      color: var(--green);
      font-size: 27px;
      letter-spacing: -.03em;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       COMMON SECTIONS
    ========================= */

    section {
      padding: 105px 0;
    }

    .section-heading {
      max-width: 720px;
      margin-bottom: 48px;
    }

    .section-kicker {
      color: var(--green);
      font: 11px monospace;
      text-transform: uppercase;
      letter-spacing: .15em;
      margin-bottom: 13px;
    }

    .section-heading h2 {
      font-size: clamp(31px, 5vw, 49px);
      line-height: 1.05;
      letter-spacing: -.045em;
      margin-bottom: 15px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    /* =========================
       EXPERTISE
    ========================= */

    .expertise-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .expertise-card {
      position: relative;
      padding: 29px;
      min-height: 250px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(
        145deg,
        rgba(14,24,30,.92),
        rgba(7,12,16,.82)
      );
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: .3s ease;
    }

    .expertise-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -70px;
      bottom: -70px;
      border-radius: 50%;
      background: rgba(0,245,160,.07);
      filter: blur(25px);
    }

    .expertise-card:hover {
      transform: translateY(-5px);
      border-color: var(--line-strong);
    }

    .icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 12px;
      border: 1px solid var(--line);
      color: var(--green);
      background: rgba(0,245,160,.05);
      font-family: monospace;
      font-weight: 800;
    }

    .expertise-card h3 {
      font-size: 18px;
      margin-bottom: 9px;
    }

    .expertise-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    /* =========================
       PROJECTS
    ========================= */

    .projects {
      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(0,245,160,.018),
          transparent
        );
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .project {
      position: relative;
      padding: 30px;
      min-height: 315px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
      transition: .3s ease;
    }

    .project:hover {
      border-color: var(--line-strong);
      transform: translateY(-4px);
    }

    .project-number {
      position: absolute;
      right: 25px;
      top: 20px;
      color: rgba(0,245,160,.12);
      font: 700 42px monospace;
    }

    .project-type {
      color: var(--green);
      font: 10px monospace;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 17px;
    }

    .project h3 {
      max-width: 80%;
      font-size: 23px;
      line-height: 1.2;
      margin-bottom: 13px;
    }

    .project p {
      max-width: 600px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 23px;
    }

    .tag {
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid rgba(0,245,160,.12);
      background: rgba(0,245,160,.035);
      color: #a8bbb6;
      font: 10px monospace;
    }

    /* =========================
       EXPERIENCE
    ========================= */

    .experience-layout {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 65px;
      align-items: start;
    }

    .experience-intro {
      position: sticky;
      top: 105px;
    }

    .experience-intro h3 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    .experience-intro p {
      color: var(--muted);
      font-size: 14px;
    }

    .timeline {
      position: relative;
      padding-left: 27px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 7px;
      bottom: 7px;
      width: 1px;
      background: linear-gradient(
        to bottom,
        var(--green),
        rgba(0,245,160,.08)
      );
    }

    .timeline-item {
      position: relative;
      padding-bottom: 45px;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .timeline-item::before {
      content: "";
      position: absolute;
      width: 9px;
      height: 9px;
      left: -27px;
      top: 8px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--green);
      box-shadow: 0 0 15px rgba(0,245,160,.45);
    }

    .timeline-date {
      color: var(--green);
      font: 10px monospace;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 8px;
    }

    .timeline-item h3 {
      font-size: 21px;
      margin-bottom: 4px;
    }

    .timeline-company {
      color: var(--cyan);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .timeline-item p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    /* =========================
       SKILLS
    ========================= */

    .skills-wrap {
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .skill-category {
      margin-bottom: 30px;
    }

    .skill-category:last-child {
      margin-bottom: 0;
    }

    .skill-category h3 {
      font-size: 14px;
      margin-bottom: 13px;
    }

    .skill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill {
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 8px;
      background: rgba(255,255,255,.025);
      color: #a9b9b6;
      font-size: 11px;
      transition: .2s ease;
    }

    .skill:hover {
      color: var(--green);
      border-color: var(--line-strong);
    }

    /* =========================
       CERTIFICATIONS
    ========================= */

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .cert {
      display: flex;
      align-items: flex-start;
      gap: 17px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.018);
    }

    .cert-icon {
      flex: 0 0 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--green);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-family: monospace;
    }

    .cert h3 {
      font-size: 14px;
      margin-bottom: 3px;
    }

    .cert p {
      color: var(--muted-2);
      font-size: 11px;
    }

    /* =========================
       ABOUT / CTA
    ========================= */

    .about-box {
      position: relative;
      padding: 60px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        radial-gradient(
          circle at 85% 20%,
          rgba(0,245,160,.08),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          rgba(13,24,30,.95),
          rgba(6,11,15,.9)
        );
      overflow: hidden;
    }

    .about-box h2 {
      max-width: 720px;
      font-size: clamp(31px, 5vw, 53px);
      line-height: 1.04;
      letter-spacing: -.05em;
      margin-bottom: 18px;
    }

    .about-box p {
      max-width: 700px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.85;
      margin-bottom: 27px;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .contact-card {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .contact-card small {
      color: var(--green);
      font: 10px monospace;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .contact-card h3 {
      margin: 10px 0 7px;
      font-size: 19px;
    }

    .contact-card p {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 45px 0;
      border-top: 1px solid rgba(255,255,255,.05);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .footer-brand {
      font-weight: 800;
      font-size: 14px;
    }

    .footer-brand span {
      color: var(--green);
    }

    .footer-copy {
      color: var(--muted-2);
      font-size: 11px;
    }

    .footer-links {
      display: flex;
      gap: 15px;
    }

    .footer-links a {
      color: var(--muted);
      font-size: 11px;
    }

    .footer-links a:hover {
      color: var(--green);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 950px) {
      .nav-links {
        display: none;
      }

      .hero {
        min-height: auto;
        padding: 75px 0 70px;
      }

      .hero-content {
        grid-template-columns: 1fr;
        gap: 50px;
      }

      .terminal {
        margin: 0;
        max-width: 650px;
      }

      .expertise-grid {
        grid-template-columns: 1fr 1fr;
      }

      .experience-layout {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .experience-intro {
        position: static;
      }
    }

    @media (max-width: 700px) {
      .container {
        width: min(calc(100% - 22px), var(--max));
      }

      .nav-wrap {
        padding: 10px 0;
      }

      .brand span {
        display: none;
      }

      .nav-cta {
        padding: 8px 11px;
        font-size: 11px;
      }

      .hero {
        padding: 60px 0 55px;
      }

      .hero h1 {
        font-size: clamp(42px, 13vw, 65px);
      }

      .hero-description {
        font-size: 15px;
      }

      .hero-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .btn {
        width: 100%;
      }

      .stats {
        margin-top: 0;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .stat {
        padding: 20px 16px;
        border-bottom: 1px solid var(--line);
      }

      .stat:nth-child(2) {
        border-right: 0;
      }

      .stat:nth-child(3),
      .stat:nth-child(4) {
        border-bottom: 0;
      }

      section {
        pa
